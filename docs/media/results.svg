<text x="388.37" y="104" fill="#52514e" font-size="13">noise floor: 3 attempts change when nothing meaningful does</text>
<text x="32" y="146" fill="#0b0b0b" font-size="15" font-weight="700">How contact is represented</text>
<text x="358" y="184.0" fill="#0b0b0b" font-size="14" text-anchor="end">Rim: 16 or 64 spheres instead of 32</text>
