[project]
name = "canadarm-capture"
version = "0.1.0"
description = "Simulating free-flyer capture by a space station arm in MuJoCo"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.15", "numpy", "pillow"]

[project.optional-dependencies]
dev = ["pytest"]
assets = ["trimesh", "scipy", "networkx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["capture"]
